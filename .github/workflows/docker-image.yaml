name: Build and publish new docker image

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Login to docker hub
        if: success()
        uses: actions-hub/docker/login@f5fdbfc3f9d2a9265ead8962c1314108a7b7ec5d # master
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REGISTRY_URL: ghcr.io

      - name: Build image
        if: success()
        run: docker build -t ghcr.io/${GITHUB_REPOSITORY}/cli:${IMAGE_TAG} .

      - name: Push to docker registry
        if: success()
        uses: actions-hub/docker/cli@f5fdbfc3f9d2a9265ead8962c1314108a7b7ec5d # master
        with:
          args: push ghcr.io/${GITHUB_REPOSITORY}/cli:${IMAGE_TAG}
