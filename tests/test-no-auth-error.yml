name: Test kubectl no auth error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: kubectl-no-auth
        name: Run kubectl without any auth (expect failure)
        uses: .
        with:
          args: get pods
        continue-on-error: true

      - name: Assert action failed due to missing auth
        env:
          OUTCOME: ${{ steps.kubectl-no-auth.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no auth is provided, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no auth was provided"
