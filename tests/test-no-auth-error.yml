name: Test kubectl fails gracefully without auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          args: version --client
        continue-on-error: true

      - name: Assert action fails without auth credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without KUBE_CONFIG or KUBE_HOST, the entrypoint exits with:
          # "No authorization data found. Please provide KUBE_CONFIG or KUBE_HOST variables."
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without auth credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (kube config may be present in environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
