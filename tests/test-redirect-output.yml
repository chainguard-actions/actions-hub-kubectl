name: Test kubectl redirect-to output variable
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          args: kustomize
          redirect-to: KUBECTL_OUTPUT
        continue-on-error: true

      - name: Assert redirect-to was processed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          KUBECTL_OUTPUT: ${{ env.KUBECTL_OUTPUT }}
        run: |
          echo "outcome: $OUTCOME"
          echo "KUBECTL_OUTPUT set: $([ -n "$KUBECTL_OUTPUT" ] && echo yes || echo no)"
          # The redirect-to feature writes kubectl output to GITHUB_ENV under the given variable name.
          # With kustomize bypass, the action runs kubectl kustomize and redirects output.
          # The action may succeed or fail (kubectl kustomize may error without a path),
          # but the redirect-to mechanism should have been invoked.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with redirect-to"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with redirect-to input set (kubectl may have errored on kustomize args)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
