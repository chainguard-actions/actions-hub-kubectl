name: Test kubectl redirect-to output variable
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          args: kustomize
          redirect-to: KUBECTL_OUTPUT
        continue-on-error: true

      - name: Assert redirect-to ran without unexpected errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
          KUBECTL_OUTPUT: ${{ env.KUBECTL_OUTPUT }}
        run: |
          echo "outcome: $OUTCOME"
          echo "KUBECTL_OUTPUT: $KUBECTL_OUTPUT"
          # The redirect-to feature writes kubectl output to GITHUB_ENV under the given variable name.
          # kustomize bypasses auth; the action should run (success or failure from kubectl itself).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with redirect-to (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
