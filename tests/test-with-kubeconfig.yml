name: Test kubectl action with kubeconfig
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare a minimal base64-encoded kubeconfig
        id: prep
        run: |
          # Create a minimal kubeconfig pointing to a non-existent server
          KUBECONFIG_CONTENT='apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
              insecure-skip-tls-verify: true
            name: test-cluster
          contexts:
          - context:
              cluster: test-cluster
              user: test-user
              namespace: default
            name: test-context
          current-context: test-context
          users:
          - name: test-user
            user:
              token: fake-token-for-testing'
          ENCODED=$(printf '%s' "$KUBECONFIG_CONTENT" | base64 -w 0)
          echo "kube_config=$ENCODED" >> $GITHUB_OUTPUT
      - name: Run kubectl version --client with kubeconfig
        id: action
        uses: .
        with:
          args: version --client
        env:
          KUBE_CONFIG: ${{ steps.prep.outputs.kube_config }}
        continue-on-error: true
      - name: Assert action ran with kubeconfig provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # kubectl version --client does not need a live cluster, so it should succeed
          # if the action correctly sets up the kubeconfig and runs kubectl
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: kubectl version --client succeeded with kubeconfig provided"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness without real cluster)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
