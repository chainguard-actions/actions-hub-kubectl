name: Test kubectl with KUBE_CONFIG credential
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal kubeconfig and encode it
        id: kubeconfig
        run: |
          cat > /tmp/kubeconfig.yaml << 'KUBEEOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
            name: test-cluster
          contexts:
          - context:
              cluster: test-cluster
              user: test-user
            name: test-context
          current-context: test-context
          users:
          - name: test-user
            user:
              token: fake-token-for-testing
          KUBEEOF
          ENCODED=$(base64 -w 0 /tmp/kubeconfig.yaml)
          echo "encoded=$ENCODED" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        with:
          args: version --client
        env:
          KUBE_CONFIG: ${{ steps.kubeconfig.outputs.encoded }}
        continue-on-error: true

      - name: Assert kubectl version --client ran successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With KUBE_CONFIG set and --client flag, kubectl version should succeed
          # without needing a real cluster connection
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: kubectl version --client succeeded with KUBE_CONFIG set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with KUBE_CONFIG and failed gracefully (expected in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
