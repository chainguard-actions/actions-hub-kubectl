name: Test kubectl redirect-to output variable
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal kubeconfig and encode it
        id: kubeconfig
        run: |
          cat > /tmp/kubeconfig.yaml << 'KUBEEOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
            name: test-cluster
          contexts:
          - context:
              cluster: test-cluster
              user: test-user
            name: test-context
          current-context: test-context
          users:
          - name: test-user
            user:
              token: fake-token-for-testing
          KUBEEOF
          ENCODED=$(base64 -w 0 /tmp/kubeconfig.yaml)
          echo "encoded=$ENCODED" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        with:
          args: version --client
          redirect-to: KUBECTL_OUTPUT
        env:
          KUBE_CONFIG: ${{ steps.kubeconfig.outputs.encoded }}
        continue-on-error: true

      - name: Assert redirect-to mechanism was invoked
        env:
          OUTCOME: ${{ steps.action.outcome }}
          KUBECTL_OUTPUT: ${{ env.KUBECTL_OUTPUT }}
        run: |
          echo "outcome: $OUTCOME"
          echo "KUBECTL_OUTPUT: $KUBECTL_OUTPUT"
          # The redirect-to input sets the 'dest' env var in entrypoint.sh.
          # When dest is set, output is written to GITHUB_ENV as a multiline var.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with redirect-to set"
            if [ -n "$KUBECTL_OUTPUT" ]; then
              echo "PASS: KUBECTL_OUTPUT was populated: $KUBECTL_OUTPUT"
            else
              echo "NOTE: KUBECTL_OUTPUT is empty (may be a timing/env issue)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with redirect-to set and failed gracefully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
