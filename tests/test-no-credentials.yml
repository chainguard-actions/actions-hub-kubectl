name: Test kubectl no credentials (graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          args: get pods
        continue-on-error: true

      - name: Assert action fails gracefully without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without KUBE_CONFIG or KUBE_HOST, the entrypoint should exit with
          # "No authorization data found. Please provide KUBE_CONFIG or KUBE_HOST variables."
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed without credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
