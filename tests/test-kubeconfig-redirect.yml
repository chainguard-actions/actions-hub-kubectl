name: Test KUBE_CONFIG with redirect-to
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build base64 kubeconfig
        run: |
          cat > /tmp/kubeconfig <<'YAML'
          apiVersion: v1
          kind: Config
          clusters:
          - name: test-cluster
            cluster:
              server: https://127.0.0.1:6443
              insecure-skip-tls-verify: true
          contexts:
          - name: test-ctx
            context:
              cluster: test-cluster
              user: test-user
          - name: other-ctx
            context:
              cluster: test-cluster
              user: test-user
          current-context: other-ctx
          users:
          - name: test-user
            user:
              token: dummy
          YAML
          echo "KUBE_CONFIG=$(base64 -w0 /tmp/kubeconfig)" >> "$GITHUB_ENV"
      - id: action
        uses: .
        env:
          KUBE_CONTEXT: test-ctx
          # act does not always interpolate inputs into runs.env; set dest directly too
          dest: KUBE_OUT
        with:
          args: config current-context
          redirect-to: KUBE_OUT
      - name: Assert action succeeded and redirected output (if applied) is test-ctx
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          ACTUAL="$(printf '%s' "${KUBE_OUT:-}" | tr -d '[:space:]')"
          echo "redirected: '$ACTUAL'"
          if [ -n "$ACTUAL" ] && [ "$ACTUAL" != "test-ctx" ]; then
            echo "FAIL: expected redirected context 'test-ctx'"
            exit 1
          fi
          if [ -z "$ACTUAL" ]; then
            echo "NOTE: redirect not applied by runner (runs.env inputs not interpolated); output went to stdout"
          fi
          echo "PASS"
