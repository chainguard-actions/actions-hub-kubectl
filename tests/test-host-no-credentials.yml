name: Test KUBE_HOST without credentials fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare certificate env
        run: |
          echo "KUBE_CERTIFICATE=$(printf 'dummy-cert' | base64 -w0)" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        env:
          KUBE_HOST: 127.0.0.1:6443
        with:
          args: config current-context
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no KUBE_TOKEN or KUBE_PASSWORD"
            exit 1
          fi
          echo "PASS"
